name: Publish demo images

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    if: github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate image folders, compose, and tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          for dockerfile in my-app/server/Dockerfile my-app/client/Dockerfile demo/database/Dockerfile; do
            test -f "$dockerfile" || { echo "::error::Missing $dockerfile"; exit 1; }
          done
          test -f demo/compose.yaml || { echo "::error::Missing demo/compose.yaml"; exit 1; }
          if grep -Eq '^[[:space:]]+(build|env_file):' demo/compose.yaml; then
            echo "::error::The platform compose file cannot contain build: or env_file:."; exit 1
          fi
          if git ls-files | grep -Eq '(^|/)\.env(\.local)?$'; then
            echo "::error::A .env or .env.local file is tracked. Remove it from Git and rotate any exposed secrets."; exit 1
          fi
          echo "Image folders, platform compose, and tracked env files look ready."

  publish:
    needs: check
    if: github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish linux/amd64 images to GHCR
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${OWNER,,}"
          repo="${REPO,,}"
          summary="$GITHUB_STEP_SUMMARY"
          {
            echo '### Images for demo/compose.yaml'
            echo
            echo 'Paste each image line into the matching service, then push the updated compose file.'
            echo
            echo '```yaml'
          } >> "$summary"

          build_and_publish() {
            local name="$1" dockerfile="$2" context="$3"
            local image="ghcr.io/${owner}/${repo}-${name}:${SHA}"
            docker buildx build \
              --platform linux/amd64 \
              --provenance=false \
              --label "org.opencontainers.image.source=https://github.com/${REPOSITORY}" \
              --file "$dockerfile" \
              --tag "$image" \
              --push \
              "$context"
            echo "# ${name}" >> "$summary"
            echo "image: ${image}" >> "$summary"
          }

          build_and_publish server my-app/server/Dockerfile my-app/server
          build_and_publish client my-app/client/Dockerfile my-app/client
          build_and_publish database demo/database/Dockerfile .
          echo '```' >> "$summary"
          echo 'GHCR packages are private by default. Make all three packages public for the simplest platform deployment; no GitHub Actions secret setup is needed.' >> "$summary"
